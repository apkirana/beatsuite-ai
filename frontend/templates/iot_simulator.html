<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Device Simulator - Beat Suite AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/iot_simulator.css') }}?v=2025apple">
    <!-- Howler.js for audio playback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Beat Suite AI" class="logo-img">
            <div class="brand-info">
                <h1>IoT Device Simulator</h1>
                <p class="subtitle">Real-time Smart Room Visualization</p>
            </div>
        </div>
        <div class="header-right">
            <button onclick="window.location.href='/dashboard'" class="back-button">← Back to Dashboard</button>
        </div>
    </div>

    <div class="main-content">
        <div class="info-banner">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
            <span>This simulator visualizes the actual IoT device states controlled by the AI. Colors, brightness, and music update in real-time.</span>
        </div>

        <div class="rooms-container" id="roomsContainer">
            <!-- Rooms will be dynamically inserted here -->
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/iot_simulator.js') }}?v=3"></script>
</body>
</html>
