<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - Beat Suite AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}?v=2025apple">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/maxima-logo.svg') }}" alt="Prinses Máxima Centrum" class="logo-img">
                <div class="brand-info">
                    <h1>Admin Management</h1>
                    <span class="subtitle">Data Management System</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <button onclick="goToDashboard()" class="nav-button">Dashboard</button>
            <button onclick="window.authUtils.logout()" class="logout-button">Logout</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-button active" onclick="showTab('patients')">👤 Patients</button>
            <button class="tab-button" onclick="showTab('rooms')">🏥 Rooms</button>
            <button class="tab-button" onclick="showTab('users')">👥 Users</button>
        </div>

        <!-- Patients Tab -->
        <div id="patients-tab" class="tab-content active">
            <div class="section-header">
                <h2>Patient Management</h2>
                <button onclick="showPatientForm()" class="btn-primary">+ Add New Patient</button>
            </div>
            <div id="patients-list" class="data-list"></div>
        </div>

        <!-- Rooms Tab -->
        <div id="rooms-tab" class="tab-content">
            <div class="section-header">
                <h2>Room Management</h2>
                <button onclick="showRoomForm()" class="btn-primary">+ Add New Room</button>
            </div>
            <div id="rooms-list" class="data-list"></div>
        </div>

        <!-- Users Tab -->
        <div id="users-tab" class="tab-content">
            <div class="section-header">
                <h2>User Management</h2>
                <button onclick="showUserForm()" class="btn-primary">+ Add New User</button>
            </div>
            <div id="users-list" class="data-list"></div>
        </div>
    </main>

    <!-- Modal for Forms -->
    <div id="formModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Form</h2>
                <button class="close-button" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}?v=11"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}?v=11"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}?v=2025"></script>
</body>
</html>
