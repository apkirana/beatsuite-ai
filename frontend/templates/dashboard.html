<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat Suite AI - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}?v=gemini2025">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/maxima-logo.svg') }}" alt="Prinses Máxima Centrum" class="logo-img" onerror="this.style.display='none'">
                <div class="brand-info">
                    <h1>Beat Suite AI</h1>
                    <span class="subtitle">Intelligent Patient Monitoring System</span>
                    <span class="location">Heidelberglaan 25, 3584 CS Utrecht</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <div class="user-info">
                <span id="userName">Loading...</span>
                <span id="userRole" class="role-badge"></span>
            </div>
            <button onclick="window.location.href='/iot-simulator'" class="admin-button" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%);">🎮 IoT Simulator</button>
            <button id="adminButton" onclick="goToAdmin()" class="admin-button" style="display: none;">⚙️ Admin</button>
            <button onclick="window.authUtils.logout()" class="logout-button">Logout</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon stat-icon-primary">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="totalRooms">0</div>
                    <div class="stat-label">Total Rooms</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon stat-icon-success">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="activeAI">0</div>
                    <div class="stat-label">AI Active</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon stat-icon-info">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="sleeping">0</div>
                    <div class="stat-label">Sleeping</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon stat-icon-warning">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="alerts">0</div>
                    <div class="stat-label">Alerts</div>
                </div>
            </div>
        </div>

        <!-- Rooms Grid -->
        <div id="roomsContainer" class="rooms-grid">
            <!-- Rooms will be loaded here -->
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading-indicator">
            <div class="spinner-large">⟳</div>
            <p>Loading patient data...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-container" style="display: none;">
            <div class="error-content">
                <span class="error-icon">⚠️</span>
                <p id="errorText"></p>
            </div>
        </div>
    </main>

    <!-- Room Detail Modal -->
    <div id="roomModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Room Details</h2>
                <button class="close-button" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Room details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Health History Modal -->
    <div id="healthHistoryModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 1200px; width: 95%;">
            <div class="modal-header">
                <h2 id="healthHistoryTitle">Health History</h2>
                <button class="close-button" onclick="closeHealthHistory()">×</button>
            </div>
            <div class="modal-body" style="padding: 30px;">
                <div style="margin-bottom: 20px;">
                    <label for="timeRangeSelect" style="font-weight: 600; margin-right: 10px;">Time Range:</label>
                    <select id="timeRangeSelect" onchange="updateHealthHistory()" style="padding: 8px 16px; border-radius: 8px; border: 1.5px solid var(--border); font-family: Inter;">
                        <option value="24">Last 24 Hours</option>
                        <option value="48">Last 48 Hours</option>
                        <option value="72">Last 3 Days</option>
                        <option value="168">Last 7 Days</option>
                    </select>
                </div>
                <div class="health-charts">
                    <div class="chart-container">
                        <h3 style="text-align: center; color: var(--primary); margin-bottom: 15px;">🌡️ Temperature (°C)</h3>
                        <canvas id="temperatureChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3 style="text-align: center; color: var(--primary); margin-bottom: 15px;">❤️ Heart Rate (BPM)</h3>
                        <canvas id="heartRateChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3 style="text-align: center; color: var(--primary); margin-bottom: 15px;">🫁 Oxygen Level (%)</h3>
                        <canvas id="oxygenChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}?v=10"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}?v=10"></script>
    <!-- Voice Chat Scripts -->
    <script src="{{ url_for('static', filename='js/voice_diagnostic.js') }}?v=diagnostic2025"></script>
    <script src="{{ url_for('static', filename='js/simple_voice_chat.js') }}?v=simple2025"></script>
    <script src="{{ url_for('static', filename='js/gemini_live_fixed.js') }}?v=fixed2025"></script>
    <script src="{{ url_for('static', filename='js/smart_assistant.js') }}?v=samantha2025"></script>
    <script src="{{ url_for('static', filename='js/quick_voice_assistant.js') }}?v=quick2025"></script>
    <script src="{{ url_for('static', filename='js/report_generator.js') }}?v=fixed2025"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}?v=debug2025"></script>
    <script src="{{ url_for('static', filename='js/health_history.js') }}?v=1"></script>
</body>
</html>
